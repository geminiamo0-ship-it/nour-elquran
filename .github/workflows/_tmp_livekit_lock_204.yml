name: CR-02B1 temporary reproducible lockfile update
on:
  push:
    branches:
      - feat/204-livekit-browser-media
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/204-livekit-browser-media
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Generate and commit only pnpm-lock.yaml
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "chore(lockfile): resolve pinned LiveKit SDK v2 (#204)"
            git push origin HEAD:feat/204-livekit-browser-media
          fi
